name: Supabase keep-alive

# Free-plan Supabase projects pause after ~7 days of low activity.
# This makes a real table read against the project every 3 days.
on:
  schedule:
    - cron: '17 9 */3 * *' # 09:17 UTC, every 3rd day of the month (max gap 3 days)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query tetris_scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing secrets SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/tetris_scores?select=name&limit=1"
          echo
          echo "OK: Supabase responded"

  # Public repos get scheduled workflows auto-disabled after 60 days without
  # repo activity. Re-enabling ourselves on each run is a best-effort guard.
  stay-enabled:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
