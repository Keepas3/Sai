name: Supabase keep-alive

# Free-plan Supabase projects pause after ~7 days of low activity. Supabase's
# docs say "a few user requests to the database each day" keeps one awake, so
# this does several real table reads against the project every day (a single
# request every few days wasn't enough to stop the "about to be paused" email).
on:
  schedule:
    - cron: '17 9 * * *'  # 09:17 UTC daily
    - cron: '43 21 * * *' # 21:43 UTC daily (second chance if a run is skipped/delayed)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query tetris_scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Missing secrets SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          fi
          # A few different reads (limit/order/count) so each run is several
          # genuine queries against the table, not one.
          for query in \
            "select=name&limit=1" \
            "select=name,score&order=score.desc&limit=5" \
            "select=name,mode&order=created_at.desc&limit=5" \
            "select=level,mode&mode=eq.sprint&order=score.asc&limit=1"; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --max-time 20 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Prefer: count=exact" \
              "${SUPABASE_URL%/}/rest/v1/tetris_scores?$query"
            echo "OK: $query"
          done

  # Public repos get scheduled workflows auto-disabled after 60 days without
  # repo activity. Re-enabling ourselves on each run is a best-effort guard.
  stay-enabled:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
